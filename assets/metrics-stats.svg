<svg xmlns="http://www.w3.org/2000/svg" width="440" height="260" viewBox="0 0 440 260">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="440" height="260" rx="12" fill="url(#card-bg)"/>
  <rect x="0.5" y="0.5" width="439" height="259" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="30" y="45" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="url(#title-grad)">📊 GitHub Stats</text>
  <rect x="30" y="56" width="120" height="2" rx="1" fill="url(#title-grad)" opacity="0.5"/>

  
    <g transform="translate(30, 85)">
      <text font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="14">⭐</text>
      <text x="28" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" dominant-baseline="central">Total Stars</text>
      <text x="410" font-family="'JetBrains Mono', monospace" font-size="14" fill="#e2e8f0" text-anchor="end" font-weight="600" dominant-baseline="central">314</text>
      <rect x="160" y="-6" width="160" height="12" rx="3" fill="#fbbf24" opacity="0.15">
        <animate attributeName="width" from="0" to="160" dur="1s" begin="0.2s" fill="freeze"/>
      </rect>
    </g>
    <g transform="translate(30, 119)">
      <text font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="14">📦</text>
      <text x="28" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" dominant-baseline="central">Repositories</text>
      <text x="410" font-family="'JetBrains Mono', monospace" font-size="14" fill="#e2e8f0" text-anchor="end" font-weight="600" dominant-baseline="central">72</text>
      <rect x="160" y="-6" width="160" height="12" rx="3" fill="#6366f1" opacity="0.15">
        <animate attributeName="width" from="0" to="160" dur="1s" begin="0.35s" fill="freeze"/>
      </rect>
    </g>
    <g transform="translate(30, 153)">
      <text font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="14">🔀</text>
      <text x="28" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" dominant-baseline="central">Total Forks</text>
      <text x="410" font-family="'JetBrains Mono', monospace" font-size="14" fill="#e2e8f0" text-anchor="end" font-weight="600" dominant-baseline="central">98</text>
      <rect x="160" y="-6" width="160" height="12" rx="3" fill="#a855f7" opacity="0.15">
        <animate attributeName="width" from="0" to="160" dur="1s" begin="0.5s" fill="freeze"/>
      </rect>
    </g>
    <g transform="translate(30, 187)">
      <text font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="14">👥</text>
      <text x="28" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" dominant-baseline="central">Followers</text>
      <text x="410" font-family="'JetBrains Mono', monospace" font-size="14" fill="#e2e8f0" text-anchor="end" font-weight="600" dominant-baseline="central">26</text>
      <rect x="160" y="-6" width="78" height="12" rx="3" fill="#ec4899" opacity="0.15">
        <animate attributeName="width" from="0" to="78" dur="1s" begin="0.6499999999999999s" fill="freeze"/>
      </rect>
    </g>
    <g transform="translate(30, 221)">
      <text font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="14">👁️</text>
      <text x="28" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" dominant-baseline="central">Profile Views</text>
      <text x="410" font-family="'JetBrains Mono', monospace" font-size="14" fill="#e2e8f0" text-anchor="end" font-weight="600" dominant-baseline="central">—</text>
      <rect x="160" y="-6" width="20" height="12" rx="3" fill="#38bdf8" opacity="0.15">
        <animate attributeName="width" from="0" to="20" dur="1s" begin="0.8s" fill="freeze"/>
      </rect>
    </g>
</svg>