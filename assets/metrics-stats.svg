<svg xmlns="http://www.w3.org/2000/svg" width="460" height="240" viewBox="0 0 460 240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0f0a20"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.4">
        <animate attributeName="stop-opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.4">
        <animate attributeName="stop-opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="460" height="240" rx="12" fill="url(#bg)"/>
  <!-- Subtle radial glow -->
  <circle cx="230" cy="120" r="120" fill="#6366f1" opacity="0.02"/>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="459" height="239" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- Title -->
  <text x="28" y="38" font-family="'Inter',sans-serif" font-size="15" font-weight="700" fill="url(#title-grad)" filter="url(#glow)">GitHub Stats</text>
  <rect x="28" y="48" width="85" height="1.5" rx="1" fill="url(#title-grad)" opacity="0.5">
    <animate attributeName="width" values="0;85" dur="0.8s" fill="freeze"/>
  </rect>

  
    <g transform="translate(28, 70)">
      <text x="0" font-family="'Inter',sans-serif" font-size="12.5" fill="#8b949e" dominant-baseline="central" font-weight="500">Total Stars</text>
      <!-- Bar background -->
      <rect x="130" y="-6" width="200" height="12" rx="6" fill="rgba(255,255,255,0.03)"/>
      <!-- Animated fill bar -->
      <rect x="130" y="-6" width="0" height="12" rx="6" fill="#f59e0b" opacity="0.35">
        <animate attributeName="width" from="0" to="200" dur="1s" begin="0.2s" fill="freeze"/>
      </rect>
      <!-- Shimmer effect on bar -->
      <rect x="130" y="-6" width="0" height="12" rx="6" fill="url(#shimmer)" opacity="0.4">
        <animate attributeName="width" from="0" to="200" dur="1s" begin="0.2s" fill="freeze"/>
      </rect>
      <!-- Glow dot at end -->
      <circle cx="330" cy="0" r="3" fill="#fbbf24" opacity="0">
        <animate attributeName="opacity" from="0" to="0.8" dur="0.3s" begin="1.1s" fill="freeze"/>
        <animate attributeName="r" values="3;4;3" dur="2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <!-- Value -->
      <text x="432" font-family="'JetBrains Mono',monospace" font-size="14" fill="#fbbf24" text-anchor="end" font-weight="700" dominant-baseline="central" opacity="0">
        314
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
      </text>
    </g>
    <g transform="translate(28, 108)">
      <text x="0" font-family="'Inter',sans-serif" font-size="12.5" fill="#8b949e" dominant-baseline="central" font-weight="500">Repositories</text>
      <!-- Bar background -->
      <rect x="130" y="-6" width="200" height="12" rx="6" fill="rgba(255,255,255,0.03)"/>
      <!-- Animated fill bar -->
      <rect x="130" y="-6" width="0" height="12" rx="6" fill="#6366f1" opacity="0.35">
        <animate attributeName="width" from="0" to="45.85987261146497" dur="1s" begin="0.35s" fill="freeze"/>
      </rect>
      <!-- Shimmer effect on bar -->
      <rect x="130" y="-6" width="0" height="12" rx="6" fill="url(#shimmer)" opacity="0.4">
        <animate attributeName="width" from="0" to="45.85987261146497" dur="1s" begin="0.35s" fill="freeze"/>
      </rect>
      <!-- Glow dot at end -->
      <circle cx="175.85987261146497" cy="0" r="3" fill="#818cf8" opacity="0">
        <animate attributeName="opacity" from="0" to="0.8" dur="0.3s" begin="1.25s" fill="freeze"/>
        <animate attributeName="r" values="3;4;3" dur="2s" begin="1.35s" repeatCount="indefinite"/>
      </circle>
      <!-- Value -->
      <text x="432" font-family="'JetBrains Mono',monospace" font-size="14" fill="#818cf8" text-anchor="end" font-weight="700" dominant-baseline="central" opacity="0">
        72
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.44999999999999996s" fill="freeze"/>
      </text>
    </g>
    <g transform="translate(28, 146)">
      <text x="0" font-family="'Inter',sans-serif" font-size="12.5" fill="#8b949e" dominant-baseline="central" font-weight="500">Total Forks</text>
      <!-- Bar background -->
      <rect x="130" y="-6" width="200" height="12" rx="6" fill="rgba(255,255,255,0.03)"/>
      <!-- Animated fill bar -->
      <rect x="130" y="-6" width="0" height="12" rx="6" fill="#a855f7" opacity="0.35">
        <animate attributeName="width" from="0" to="62.42038216560509" dur="1s" begin="0.5s" fill="freeze"/>
      </rect>
      <!-- Shimmer effect on bar -->
      <rect x="130" y="-6" width="0" height="12" rx="6" fill="url(#shimmer)" opacity="0.4">
        <animate attributeName="width" from="0" to="62.42038216560509" dur="1s" begin="0.5s" fill="freeze"/>
      </rect>
      <!-- Glow dot at end -->
      <circle cx="192.42038216560508" cy="0" r="3" fill="#c084fc" opacity="0">
        <animate attributeName="opacity" from="0" to="0.8" dur="0.3s" begin="1.4s" fill="freeze"/>
        <animate attributeName="r" values="3;4;3" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <!-- Value -->
      <text x="432" font-family="'JetBrains Mono',monospace" font-size="14" fill="#c084fc" text-anchor="end" font-weight="700" dominant-baseline="central" opacity="0">
        98
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.6s" fill="freeze"/>
      </text>
    </g>
    <g transform="translate(28, 184)">
      <text x="0" font-family="'Inter',sans-serif" font-size="12.5" fill="#8b949e" dominant-baseline="central" font-weight="500">Followers</text>
      <!-- Bar background -->
      <rect x="130" y="-6" width="200" height="12" rx="6" fill="rgba(255,255,255,0.03)"/>
      <!-- Animated fill bar -->
      <rect x="130" y="-6" width="0" height="12" rx="6" fill="#ec4899" opacity="0.35">
        <animate attributeName="width" from="0" to="16.560509554140125" dur="1s" begin="0.6499999999999999s" fill="freeze"/>
      </rect>
      <!-- Shimmer effect on bar -->
      <rect x="130" y="-6" width="0" height="12" rx="6" fill="url(#shimmer)" opacity="0.4">
        <animate attributeName="width" from="0" to="16.560509554140125" dur="1s" begin="0.6499999999999999s" fill="freeze"/>
      </rect>
      <!-- Glow dot at end -->
      <circle cx="146.56050955414014" cy="0" r="3" fill="#f472b6" opacity="0">
        <animate attributeName="opacity" from="0" to="0.8" dur="0.3s" begin="1.5499999999999998s" fill="freeze"/>
        <animate attributeName="r" values="3;4;3" dur="2s" begin="1.65s" repeatCount="indefinite"/>
      </circle>
      <!-- Value -->
      <text x="432" font-family="'JetBrains Mono',monospace" font-size="14" fill="#f472b6" text-anchor="end" font-weight="700" dominant-baseline="central" opacity="0">
        26
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.75s" fill="freeze"/>
      </text>
    </g>
</svg>